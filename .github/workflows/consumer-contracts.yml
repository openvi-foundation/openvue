name: Consumer Contracts

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    package-artifacts:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              with:
                  version: 9.15.9
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 20
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Verify migration contracts
              run: pnpm --filter migrate test:unit
            - name: Build and pack local packages
              run: pnpm run test:artifacts:pack
              env:
                  OPENVUE_TEST_ARTIFACTS: test-artifacts
            - name: Verify package surfaces
              run: pnpm run verify:dist && node scripts/verify-package-contracts.mjs
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: openvue-test-artifacts
                  path: test-artifacts
                  if-no-files-found: error

    consumers:
        needs: package-artifacts
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                fixture: [vite-manual, vite-auto-import, nuxt, laravel-vite, laravel-inertia, volt]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              with:
                  version: 9.15.9
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 20
                  cache: pnpm
            - name: Set up PHP for Laravel
              if: startsWith(matrix.fixture, 'laravel-')
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
              with:
                  php-version: '8.2'
                  tools: composer:v2
                  coverage: none
            - run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: openvue-test-artifacts
                  path: test-artifacts
            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium
            - name: Migrate, typecheck, build, and smoke ${{ matrix.fixture }}
              run: node scripts/run-consumer-tests.mjs ${{ matrix.fixture }} --skip-package-build --browser
              env:
                  OPENVUE_TEST_ARTIFACTS: test-artifacts
