name: Verify API Docs

on:
    pull_request:
        paths:
            - 'packages/primevue/src/**/*.d.ts'
            - 'packages/forms/**/*.d.ts'
            - 'packages/primevue/src/**/style/*.js'
            - 'packages/themes/src/presets/**/index.js'
            - 'apps/showcase/scripts/build-apidoc.cjs'
            - 'apps/showcase/doc/common/apidoc/index.json'
            - '.github/workflows/generate_api_doc.yml'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              with:
                  version: 9.15.9

            - name: Use Node.js 20
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 20
                  cache: 'pnpm'

            - name: Install node packages
              run: pnpm install --frozen-lockfile

            - name: Generate API docs
              run: pnpm run build:apidoc

            - name: Format generated API docs
              run: pnpm exec prettier --write apps/showcase/doc/common/apidoc/index.json

            - name: Verify generated API docs are up to date
              shell: bash
              run: |
                  changes="$(git status --porcelain --untracked-files=all -- apps/showcase/doc/common/apidoc/index.json)"

                  if [[ -n "$changes" ]]; then
                      echo "$changes"
                      git diff --stat -- apps/showcase/doc/common/apidoc/index.json
                      echo "::error::API documentation is out of date. Run 'pnpm run build:apidoc && pnpm exec prettier --write apps/showcase/doc/common/apidoc/index.json' and commit the result with this pull request."
                      exit 1
                  fi
