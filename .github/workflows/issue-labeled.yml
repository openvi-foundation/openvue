name: Issue Labeled

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  issue-labeled:
    permissions:
      issues: write # for github-script to comment on / close issues
      pull-requests: write # for github-script to update PRs
    runs-on: ubuntu-latest
    steps:
      - name: Cannot Replicate
        if: "${{ github.event.label.name == 'Resolution: Cannot Replicate'}}"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "We haven't been able to replicate this. Please edit the issue to add a minimal reproduction (a StackBlitz project or a small repository) or more detail about your setup. This issue will be closed if there is no activity in 20 days."
            });

      - name: Needs Upvote
        if: contains(github.event.label.name, 'Needs Upvote')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Thanks a lot for this issue! Community feedback is what drives our priorities, so upvotes on the first post help us see how many people this affects and address it sooner."
            });

      - name: Needs More Information
        if: contains(github.event.label.name, 'Needs More Information')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "More information is needed to find a solution. A runnable StackBlitz example and additional details would be helpful."
            });

      - name: Wontfix
        if: contains(github.event.label.name, 'Wontfix')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Unfortunately this cannot be fixed without introducing other problems, so we have decided not to pursue it. Thanks a lot for your understanding!"
            });

      - name: Help Wanted
        if: contains(github.event.label.name, 'Help Wanted')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "This issue is open for anyone to work on, and we would welcome the help. [**Make sure to reference this issue in your pull request.**](https://docs.github.com/en/issues/tracking-your-work-with-issues/linking-a-pull-request-to-an-issue) :sparkles: Thank you for your contribution! :sparkles:"
            });

      - name: Duplicate
        if: contains(github.event.label.name, 'Duplicate')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "This issue has been marked as a duplicate and has been closed. Please refer to the original issue for updates. Thank you!"
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
